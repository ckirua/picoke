[build-system]
requires = ["setuptools>=77", "Cython>=3.3.1,<4", "picop>=3.13,<4", "pybind11>=3.1,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "picoke"
version = "0.1.0rc4"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "picop>=3.13,<4",
    "pybase64>=1.5.2,<1.6",
    "pycryptodome>=3.24.1,<4",
    "btclib-secp256k1>=0.8.0.16,<0.9",
    "eth-account>=0.14,<0.15",
]

[project.optional-dependencies]
toml = ["tomli-w>=1.2,<2"]
yaml = ["PyYAML>=6.0.4,<7"]
files = ["tomli-w>=1.2,<2", "PyYAML>=6.0.4,<7"]
binary-logging = ["msgpack>=1.1,<2"]

[project.urls]
Repository = "https://github.com/ckirua/picoke"
Changelog = "https://github.com/ckirua/picoke/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
picoke = ["py.typed", "*.pyi"]
"picoke.crypto" = ["*.pyi"]
