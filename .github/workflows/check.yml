name: Installed wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installed-wheel:
    name: CPython ${{ matrix.python }} / Linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Build and install from sdist
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          python -m pip install build pytest
          python -m build --sdist
          python -m pip wheel --no-deps dist/*.tar.gz -w wheelhouse
          python -m pip install wheelhouse/*.whl
      - name: Test installed distribution outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m pytest "$GITHUB_WORKSPACE/tests" -q
