name: Publish picoke

on:
  workflow_dispatch:
    inputs:
      release-tag:
        description: Existing GitHub release tag (picoke-vX.Y.Z or picoke-vX.Y.ZrcN)
        required: true
        type: string
      publish:
        description: Upload to production PyPI (unchecked validates only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: picoke-publish-${{ inputs.release-tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build release sdist
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      commit: ${{ steps.release.outputs.commit }}
      sha256: ${{ steps.artifact.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the release tag
        id: release
        env:
          TAG: ${{ inputs.release-tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$TAG" =~ ^picoke-v[0-9]+\.[0-9]+\.[0-9]+(rc[1-9][0-9]*)?$ ]]
          ref="refs/tags/$TAG"
          test "$(git cat-file -t "$ref")" = tag
          commit=$(git rev-parse "$ref^{commit}")
          git merge-base --is-ancestor "$commit" HEAD
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")
          test "$(jq -r .draft <<< "$release")" = false
          if [[ $TAG == *rc* ]]; then
            test "$(jq -r .prerelease <<< "$release")" = true
          else
            test "$(jq -r .prerelease <<< "$release")" = false
          fi
          git checkout --detach "$commit"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.15'
          allow-prereleases: true
      - name: Build and check one sdist
        id: artifact
        env:
          TAG: ${{ inputs.release-tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          with open('pyproject.toml', 'rb') as file:
              project = tomllib.load(file)['project']
          assert project['name'] == 'picoke'
          assert project['version'] == os.environ['TAG'].removeprefix('picoke-v')
          PY
          python -m pip install build twine
          python -m build --sdist
          asset="dist/${TAG/picoke-v/picoke-}.tar.gz"
          test -f "$asset"
          python -m twine check --strict "$asset"
          printf 'sha256=%s\n' "$(sha256sum "$asset" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: picoke-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  validate:
    name: Validate sdist / CPython ${{ matrix.python }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: picoke-sdist
          path: ${{ runner.temp }}/dist
      - name: Install and test outside the checkout
        working-directory: ${{ runner.temp }}
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          printf '%s  %s\n' "$SHA256" dist/*.tar.gz | sha256sum --check --strict
          sudo apt-get update
          sudo apt-get install -y libssl-dev
          python -m pip install pytest dist/*.tar.gz
          python -I -m pytest "$GITHUB_WORKSPACE/tests" -q

  publish:
    name: Upload exact validated sdist to PyPI
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, validate]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: picoke-sdist
          path: dist
      - name: Verify artifact checksum
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: printf '%s  %s\n' "$SHA256" dist/*.tar.gz | sha256sum --check --strict
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
